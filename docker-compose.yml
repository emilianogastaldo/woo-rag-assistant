name: woo-chatbot

services:
  # Test/eval offline: nessuna rete, nessun segreto, nessun servizio dipendente.
  eval-offline:
    image: woo-rag-api:issue7
    build: ./chatbot
    pull_policy: never
    profiles: ["eval"]
    network_mode: none
    environment:
      PYTHONPATH: /app:/
      OPENAI_API_KEY: ""
      LANGCHAIN_TRACING_V2: "false"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - ./chatbot:/app
      - ./evals:/evals
    command: python -m evals.run_agent_eval

  # --- Il negozio: WordPress + WooCommerce ---
  db:
    image: mariadb@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp_secret
      MARIADB_ROOT_PASSWORD: root_secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  wordpress:
    image: wordpress@sha256:cc795f5862b2f3891a805106917089558eef28a56755bd8ac8308d1ab57b28d7
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_secret
    volumes:
      - wp_data:/var/www/html
    healthcheck:
      # Ready only after WordPress core and WooCommerce seed (HTTP + PHP + DB).
      test: ["CMD", "php", "-r", "exit((json_decode(@file_get_contents('http://127.0.0.1/wp-json/wp/v2/types/product'), true)['slug'] ?? '') === 'product' ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Vector store per il RAG ---
  chromadb:
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "false"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Backend FastAPI: orchestratore chat (RAG + tool calling) ---
  chatbot-api:
    image: woo-rag-api:issue7
    build: ./chatbot
    depends_on:
      wordpress:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-15}
      PROVIDER_RETRY_ATTEMPTS: ${PROVIDER_RETRY_ATTEMPTS:-1}
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      KNOWLEDGE_STATE_DIR: /state/knowledge
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION}
      WC_BASE_URL: http://wordpress/wp-json/wc/v3
      WC_SIGN_URL: ${WC_SIGN_URL}
      WC_CONSUMER_KEY: ${WC_CONSUMER_KEY}
      WC_CONSUMER_SECRET: ${WC_CONSUMER_SECRET}
      WC_TIMEOUT_SECONDS: ${WC_TIMEOUT_SECONDS:-5}
      WC_RETRY_ATTEMPTS: ${WC_RETRY_ATTEMPTS:-1}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_ENV: ${APP_ENV:-development}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      CONVERSATION_TTL_SECONDS: ${CONVERSATION_TTL_SECONDS:-1800}
      CONVERSATION_CAPACITY: ${CONVERSATION_CAPACITY:-1000}
      CONVERSATION_MAX_TURNS: ${CONVERSATION_MAX_TURNS:-20}
      MESSAGE_MAX_BYTES: ${MESSAGE_MAX_BYTES:-4000}
      HISTORY_MAX_BYTES: ${HISTORY_MAX_BYTES:-16000}
      CHAT_BODY_MAX_BYTES: ${CHAT_BODY_MAX_BYTES:-24000}
      MODEL_CONTEXT_MAX_BYTES: ${MODEL_CONTEXT_MAX_BYTES:-32000}
      MODEL_TOKEN_BUDGET: ${MODEL_TOKEN_BUDGET:-100000}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-512}
      TOOL_OUTPUT_MAX_BYTES: ${TOOL_OUTPUT_MAX_BYTES:-12000}
      CUSTOMER_CACHE_TTL_SECONDS: ${CUSTOMER_CACHE_TTL_SECONDS:-300}
      CUSTOMER_CACHE_CAPACITY: ${CUSTOMER_CACHE_CAPACITY:-1000}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-10000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8000}
      WIDGET_DIR: /widget
      RETRIEVAL_STRATEGY: ${RETRIEVAL_STRATEGY:-semantic}
      RETRIEVAL_K: ${RETRIEVAL_K:-4}
      RETRIEVAL_CANDIDATES: ${RETRIEVAL_CANDIDATES:-12}
      RETRIEVAL_MAX_DISTANCE: ${RETRIEVAL_MAX_DISTANCE:-0.6}
      RETRIEVAL_RRF_CONSTANT: ${RETRIEVAL_RRF_CONSTANT:-60}
      RETRIEVAL_SEMANTIC_WEIGHT: ${RETRIEVAL_SEMANTIC_WEIGHT:-1.0}
      RETRIEVAL_LEXICAL_WEIGHT: ${RETRIEVAL_LEXICAL_WEIGHT:-1.0}
      RETRIEVAL_BM25_K1: ${RETRIEVAL_BM25_K1:-1.5}
      RETRIEVAL_BM25_B: ${RETRIEVAL_BM25_B:-0.75}
      RETRIEVAL_LEXICAL_MIN_SCORE: ${RETRIEVAL_LEXICAL_MIN_SCORE:-1.0}
      RETRIEVAL_LEXICAL_MIN_COVERAGE: ${RETRIEVAL_LEXICAL_MIN_COVERAGE:-1.0}
      RETRIEVAL_RETRY_ATTEMPTS: ${RETRIEVAL_RETRY_ATTEMPTS:-0}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-4}
      AGENT_MAX_ATTEMPTS: ${AGENT_MAX_ATTEMPTS:-12}
      AGENT_RETRY_BUDGET: ${AGENT_RETRY_BUDGET:-2}
      AGENT_MAX_REPEATED_ERRORS: ${AGENT_MAX_REPEATED_ERRORS:-2}
      REQUEST_DEADLINE_SECONDS: ${REQUEST_DEADLINE_SECONDS:-30}
    volumes:
      - ./chatbot:/app
      - knowledge_state:/state/knowledge
      # Il widget è servito dal backend su /widget per comodità di demo.
      - ./widget:/widget:ro
      - ./evals:/evals
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-proxy-headers

  # --- Pipeline di ingestion (one-shot, profilo dedicato) ---
  # Esecuzione: docker compose run --rm ingest
  ingest:
    image: woo-rag-ingest:issue7
    build: ./chatbot
    profiles: ["ingest"]
    depends_on:
      wordpress:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      KNOWLEDGE_STATE_DIR: /state/knowledge
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION}
      WC_BASE_URL: http://wordpress/wp-json/wc/v3
      WC_SIGN_URL: ${WC_SIGN_URL}
      WC_CONSUMER_KEY: ${WC_CONSUMER_KEY}
      WC_CONSUMER_SECRET: ${WC_CONSUMER_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-15}
      PROVIDER_RETRY_ATTEMPTS: ${PROVIDER_RETRY_ATTEMPTS:-1}
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY}
    volumes:
      - knowledge_state:/state/knowledge
    command: python -m app.ingest

  # --- WP-CLI: installazione WordPress/WooCommerce e seed dati demo ---
  # Esecuzione: docker compose run --rm wpcli wp <comando>
  # oppure lo script completo: docker compose run --rm wpcli /seed/setup.sh
  wpcli:
    image: wordpress@sha256:f8aeb68164c6a04f5dcc91da30d8ffa096b0f7fafb7a65f144c2dd62587caca0
    profiles: ["cli"]
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - ./seed:/seed
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_secret

volumes:
  db_data:
  wp_data:
  chroma_data:
  knowledge_state:
