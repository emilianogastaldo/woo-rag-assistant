name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: chatbot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: chatbot/requirements.lock

      - name: Installa il progetto con gli extra di sviluppo
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e ".[dev]"
          pip check

      - name: Lint (ruff)
        run: ruff check . ../evals --config pyproject.toml

      - name: Lint runner migrazione
        run: >-
          ruff check ../scripts --config pyproject.toml
          --config 'lint.isort.known-first-party=["app","evals"]'

      - name: Test runner migrazione (rete bloccata)
        run: PYTHONPATH=..:. pytest -q ../scripts/test_demo_candidate.py

      - name: Test (pytest)
        run: pytest -q

      - name: Eval deterministici (rete bloccata dal runner)
        run: PYTHONPATH=..:. python -m evals.run_agent_eval --output ../evals/results/ci.json

      - name: Ablazioni retrieval offline (BM25 e RRF reali, adapter locali)
        run: >-
          PYTHONPATH=..:. python -m evals.run_retrieval_eval --repeats 3
          --output ../evals/results/ci-retrieval.json

      - name: Report eval senza payload o segreti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-eval
          path: evals/results/ci*.json
          if-no-files-found: ignore
