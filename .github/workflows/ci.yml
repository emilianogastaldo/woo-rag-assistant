name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatbot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chatbot/pyproject.toml

      - name: Installa il progetto con gli extra di sviluppo
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check . ../evals --config pyproject.toml

      - name: Test (pytest)
        run: pytest -q

      - name: Eval deterministici (rete bloccata dal runner)
        run: PYTHONPATH=..:. python -m evals.run_agent_eval --output ../evals/results/ci.json

      - name: Ablazioni retrieval offline (BM25 e RRF reali, adapter locali)
        run: >-
          PYTHONPATH=..:. python -m evals.run_retrieval_eval --repeats 3
          --output ../evals/results/ci-retrieval.json

      - name: Report eval senza payload o segreti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-eval
          path: evals/results/ci*.json
          if-no-files-found: ignore
