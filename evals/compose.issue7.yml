# Run ONLY via run_issue7_integration.py: audited, unique, synthetic, internal network.
x-env: &app-env
  OPENAI_API_KEY: synthetic-secret
  OPENAI_MODEL: synthetic-chat
  EMBEDDING_MODEL: synthetic-embedding
  EMBEDDING_DIMENSIONS: "8"
  OPENAI_BASE_URL: http://upstream:9000/v1
  PROVIDER_TIMEOUT_SECONDS: "2"
  PROVIDER_RETRY_ATTEMPTS: "0"
  WC_BASE_URL: http://wordpress/wp-json/wc/v3
  WC_SIGN_URL: http://wordpress/wp-json/wc/v3
  WC_CONSUMER_KEY: ck_synthetic
  WC_CONSUMER_SECRET: cs_synthetic
  WC_TIMEOUT_SECONDS: "2"
  WC_RETRY_ATTEMPTS: "0"
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: ${TEST_COLLECTION:?}
  KNOWLEDGE_STATE_DIR: /state/knowledge
  RETRIEVAL_STRATEGY: hybrid
  SESSION_SECRET: synthetic-session
  RATE_LIMIT_REQUESTS: "10000"
  ANONYMIZED_TELEMETRY: "false"
  LANGCHAIN_TRACING_V2: "false"
x-wp: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: synthetic
  WORDPRESS_DB_USER: synthetic
  WORDPRESS_DB_PASSWORD: synthetic-password
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_HTTP_BLOCK_EXTERNAL', true);
    define('DISABLE_WP_CRON', true);
    define('AUTOMATIC_UPDATER_DISABLED', true);
services:
  db:
    image: mariadb@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
    environment:
      MARIADB_DATABASE: synthetic
      MARIADB_USER: synthetic
      MARIADB_PASSWORD: synthetic-password
      MARIADB_ROOT_PASSWORD: synthetic-root
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 3s
      retries: 45
  wordpress:
    image: ${WP_IMAGE:?}
    environment: *wp-env
    volumes: [wp:/var/www/html]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit((json_decode(@file_get_contents('http://127.0.0.1/wp-json/wp/v2/types/product'), true)['slug'] ?? '') === 'product' ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 45
  cli:
    image: ${CLI_IMAGE:?}
    user: "33:33"
    environment: *wp-env
    volumes: [wp:/var/www/html]
    command: sh /seed.sh
  chroma:
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    environment:
      ANONYMIZED_TELEMETRY: "false"
    volumes: [chroma:/data]
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -1 <&3 | grep -q '200 OK'"]
      interval: 2s
      timeout: 3s
      retries: 45
  upstream:
    image: ${RUNNER_IMAGE:?}
    healthcheck:
      disable: true
    command: uvicorn evals.issue6_fake_upstream:app --host 0.0.0.0 --port 9000
  api:
    image: ${API_IMAGE:?}
    environment: *app-env
    volumes: [state:/state/knowledge]
  dev:
    image: ${API_IMAGE:?}
    environment:
      <<: *app-env
      PYTHONPATH: /app
    volumes:
      - state:/state/knowledge
      - ../chatbot:/app:ro
  ingest:
    image: ${INGEST_IMAGE:?}
    environment: *app-env
    volumes: [state:/state/knowledge]
    command: python -m app.ingest
  runner:
    image: ${RUNNER_IMAGE:?}
    environment: *app-env
    volumes:
      - state:/state/knowledge
      - ${ISSUE7_RESULTS:?}:/results
    command: python -m evals.issue7_integration --phase scenarios
networks:
  default:
    internal: true
volumes:
  state:
  chroma:
  wp:
  db:
